<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas de Automação IFRJ</title>
    <link rel="icon" href="iconeSiteIF.webp">
    <!-- Fonte Inter e Google Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <img src="logoIF.png" id="logo" alt="Logo IFRJ">
                <div class="brand-info">
                    <h1>Sistema de Gerenciamento de Salas</h1>
                    <p>Painel de Controle de Ambientes</p>
                </div>
            </div>
            <div class="system-status">
                <span class="status-dot"></span>
                <span>Sistema Operacional</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="section-title">
            <h2>Selecione uma Sala</h2>
            <p>Gerencie iluminação, temperatura, acesso e monitoramento</p>
        </div>

        <div class="salas-grid">
            <!-- Gerado dinamicamente ou listado estaticamente -->
            <button onclick="irParaSala(event)" data-sala="1" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 01</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="2" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 02</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="3" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 03</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="4" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 04</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="5" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 05</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="6" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 06</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="7" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 07</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="8" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 08</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="9" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 09</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="10" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 10</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="11" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 11</span>
                <span class="sala-badge">Acessar</span>
            </button>
            <button onclick="irParaSala(event)" data-sala="12" class="sala-card">
                <span class="material-symbols-outlined icon">meeting_room</span>
                <span class="sala-name">Sala 12</span>
                <span class="sala-badge">Acessar</span>
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
