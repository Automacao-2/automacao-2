<html>
	<head>
		<meta charset="UTF-8">
		<title>Sala _</title>
		<link rel="stylesheet" href="style_sala.css">
	</head>

	<body>
        <img src="../logoIF.png" id="logo">

        <div class="conteudo">
            <h1 id="salaNum">Sala_</h1>

            <div class="salas">
                <button onclick="voltar()">
                    Voltar
                </button>

                <button onclick="abrirPorta()" id="porta" class="acao">
                    Abrir porta <br>
                    Status: <b> TRANCADA </b>
                </button>

                <div class="card-ar">
                    <button onclick="ligarAr()" id="ar" class="acao">
                        Ligar ar-condicionado <br>
                        Status: <b> DESLIGADO </b>
                    </button>

                    <div class="temp-controle">
                        <button onclick="mudarTemp(-1)" aria-label="Diminuir temperatura">&minus;</button>
                        <span id="tempAr">23ºC</span>
                        <button onclick="mudarTemp(1)" aria-label="Aumentar temperatura">+</button>
                    </div>
                </div>

                <button onclick="ligarLuz()" id="luz" class="acao">
                    Ligar luz <br>
                    Status: <b> DESLIGADA </b>
                </button>

                <button onclick="monitoramento()" id="monitorar" class="acao">
                    Monitorar
                </button>
            </div>
        </div>

        <div id="modalCamera" class="modal">
            <div class="modal-conteudo">
                <span class="fechar" onclick="fecharMonitoramento()">&times;</span>
                <h2>Câmera da Sala</h2>
                <div class="video-container">
                    <img id="streamCamera" src="" alt="Aguardando sinal da câmera..."> <!-- A imagem de transmissão do ESP32-CAM será carregada aqui -->
                </div>
            </div>
        </div>

        <script src="script_sala.js"></script>
	</body>
</html>
