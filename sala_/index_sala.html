<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala - Controle IFRJ</title>
    <!-- Fonte Inter e Google Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="style_sala.css">
</head>
<body>
    <!-- Toast para notificações -->
    <div id="toast" class="toast"></div>

    <header class="app-header">
        <div class="header-container">
            <button class="btn-voltar" onclick="voltar()">
                <span class="material-symbols-outlined">arrow_back</span>
                <span>Voltar</span>
            </button>

            <div class="brand">
                <img src="../logoIF.png" id="logo" alt="Logo IFRJ">
                <h1 id="salaNum">Sala --</h1>
            </div>

            <div id="connectionStatus" class="connection-status desconnectado">
                <span class="status-dot"></span>
                <span id="statusText">Desconectado</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="grid-controles">
            <!-- Tranca / Porta -->
            <div class="card-controle" id="cardPorta">
                <div class="card-header">
                    <span class="material-symbols-outlined card-icon" id="iconPorta">lock</span>
                    <span class="badge" id="badgePorta">FECHADA</span>
                </div>
                <div class="card-body">
                    <h3>Tranca da Porta</h3>
                    <p>Controle de acesso do ambiente</p>
                </div>
                <button onclick="abrirPorta()" id="btnPorta" class="btn-action">
                    Abrir Porta
                </button>
            </div>

            <!-- Iluminação -->
            <div class="card-controle" id="cardLuz">
                <div class="card-header">
                    <span class="material-symbols-outlined card-icon" id="iconLuz">lightbulb</span>
                    <span class="badge" id="badgeLuz">DESLIGADA</span>
                </div>
                <div class="card-body">
                    <h3>Iluminação Principal</h3>
                    <p>Liga ou desliga as luzes da sala</p>
                </div>
                <button onclick="ligarLuz()" id="btnLuz" class="btn-action">
                    Ligar Luz
                </button>
            </div>

            <!-- Ar-Condicionado -->
            <div class="card-controle" id="cardAr">
                <div class="card-header">
                    <span class="material-symbols-outlined card-icon" id="iconAr">ac_unit</span>
                    <span class="badge" id="badgeAr">DESLIGADO</span>
                </div>
                <div class="card-body">
                    <h3>Climatização</h3>
                    <div class="temp-display">
                        <span id="tempAr">23</span><span class="unit">°C</span>
                    </div>
                    <div class="temp-controle">
                        <button onclick="mudarTemp(-1)" class="btn-temp" aria-label="Diminuir temperatura">
                            <span class="material-symbols-outlined">remove</span>
                        </button>
                        <button onclick="mudarTemp(1)" class="btn-temp" aria-label="Aumentar temperatura">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                    </div>
                </div>
                <button onclick="ligarAr()" id="btnAr" class="btn-action">
                    Ligar Ar
                </button>
            </div>

            <!-- Monitoramento Câmera -->
            <div class="card-controle">
                <div class="card-header">
                    <span class="material-symbols-outlined card-icon">videocam</span>
                    <span class="badge badge-info">ESP32-CAM</span>
                </div>
                <div class="card-body">
                    <h3>Câmera em Tempo Real</h3>
                    <p>Visualizar transmissão ao vivo</p>
                </div>
                <button onclick="monitoramento()" class="btn-action btn-secondary">
                    Abrir Câmera
                </button>
            </div>
        </div>
    </main>

    <!-- Modal da Câmera -->
    <div id="modalCamera" class="modal">
        <div class="modal-conteudo">
            <div class="modal-header">
                <h2>Transmissão ao Vivo</h2>
                <span class="fechar" onclick="fecharMonitoramento()">&times;</span>
            </div>
            <div class="video-container">
                <img id="streamCamera" src="" alt="Aguardando sinal da câmera...">
            </div>
        </div>
    </div>

    <script src="script_sala.js"></script>
</body>
</html>
