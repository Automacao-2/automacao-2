<html>
	<head>
		<title>Sala _</title>
		<link rel="stylesheet" href="style.css">
	</head>

	<body>
        <img src="../logoIF.png" id="logo">

        <div class="conteudo">
            <h1 id="salaNum">Sala_</h1>

            <div class="salas">
                <button onclick="voltar()">
                    Voltar
                </button>

                <button onclick="abrirPorta()" id="porta" class="acao">
                    Abrir porta <br>
                    Status: <b> TRANCADA </b>
                </button>

                <button onclick="ligarAr()" id="ar" class="acao">
                    Ligar ar-condicionado <br>
                    Status: <b> DESLIGADO </b> <br>
                    Temperatura: 23ºC
                </button>

                <button onclick="ligarLuz()" id="luz" class="acao">
                    Ligar luz <br>
                    Status: <b> DESLIGADA </b>
                </button>

                <button onclick="monitoramento()" id="monitorar" class="acao">
                    Monitorar
                </button>
            </div>
        </div>

        <script src="script.js"></script>
	</body>
</html>
